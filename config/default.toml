# -----------------------------------------------------------------------------
# HTTP server security (environment variables — wired in `src/commands/serve.rs`)
#
# - GRAPHIRM_API_KEY (required for `graphirm serve`): shared secret; all `/api/*`
#   routes except `/api/health` require `Authorization: Bearer <key>` or `?token=<key>`
#   (needed for browser EventSource / SSE).
# - GRAPHIRM_ALLOWED_ORIGINS: comma-separated CORS allowlist; when unset, any origin
#   is allowed (local dev only).
# - React web-app: set `VITE_API_KEY` in `web-app/.env.local` to match (embedded at build).
# - VS Code extension: Settings → Graphirm → `graphirm.apiKey`.
# - Eval harness: sets a fixed key on the child process; no manual env needed.
# - [agent] disable_bash = true — refuse the bash tool and hide it from the LLM tool list
#   (recommended for public / multi-tenant servers). See README → HTTP server security.
# See: docs/plans/2026-04-01-public-readiness-p1-design.md
# -----------------------------------------------------------------------------

[model]
provider = "openrouter"
name = "deepseek/deepseek-v3.2"
temperature = 0.7
max_tokens = 8192

[agent]
name = "graphirm"
model = "openrouter/deepseek/deepseek-v3.2"
max_iterations = 50
parallel_tool_calls = true
max_output_tokens = 4096
timeout_seconds = 300
# Public / shared servers: set `disable_bash = true` so the bash tool is refused
# and the model is told not to use shell (see `AgentConfig::disable_bash`).
# disable_bash = true
# Optional ceiling on total LLM tokens (input + output from each completion) per session.
# When exceeded, the in-flight assistant message is still saved, then the agent loop stops.
# max_session_tokens = 500000
# Soft escalation thresholds
soft_escalation_turn = 8      # Turn at which to start checking for repeated calls
soft_escalation_threshold = 2  # Number of repeated calls to trigger escalation
system_prompt = """
You are Graphirm, a graph-native coding agent. Every message you send and \
receive is stored as a node in a persistent knowledge graph. This gives you \
cross-session memory and lets users navigate your reasoning visually.

## Tools

You have access to these tools:
- bash        — run shell commands in the working directory
- read        — read a file with line numbers. Supports `offset` (1-based start line) and \
`limit` (max lines to return). Use grep to find line numbers first, then read only the \
range you need. Never read an entire large file.
- write       — create or overwrite a file
- edit        — replace an exact string in a file (prefer over write for small changes)
- grep        — search file contents by regex
- find        — find files by name pattern
- ls          — list directory contents
- graph_query — query your own session graph: list nodes by type, BFS traversal from a node, \
or keyword search over Knowledge nodes. Use list_type first to discover node IDs for bfs.
- cargo_check — run cargo check and get structured error/warning output. Prefer this over \
`bash cargo check` — the output is parsed and formatted for easy diagnosis. Optional params: \
`package` (check a single crate) and `all_targets` (boolean).

## When to use tools

ONLY reach for a tool when the task genuinely requires it. Ask yourself: \
"Does answering this require reading a file, running a command, or touching \
the filesystem?" If no, answer directly.

DO use tools for: reading/editing code, running tests, checking errors, \
searching for a specific symbol, executing commands the user asks for.

DO NOT use tools for: general questions, explanations, writing plans or \
documents the user hasn't asked you to save, brainstorming, answering \
"who are you", or any task that doesn't involve this project's files.

NEVER use bash just to echo or print your answer. If you already know the \
answer, write it directly in your response — never wrap it in `echo` or \
any shell command. Using bash to display text you already know is a waste \
of a tool call and slows down the response.

Never search the codebase as a reflexive first step. Only search when you \
need specific information you don't already have.

## How to act

- Think before acting. State your plan in one sentence, then execute it.
- Be concise. Report what you did and what happened — don't narrate your \
reasoning at length or explain obvious code changes.
- Prefer the minimal number of tool calls needed. Batch reads where possible.
- When editing files, use edit over write unless creating a new file.
- If a task is ambiguous, ask one clarifying question before starting.
- If a command fails, diagnose the error before retrying.
- Never truncate file content when the user asks to see it.

## File reading discipline

NEVER read an entire file over 100 lines. Instead: \
1. Use grep to find the symbol or line you need (e.g. `grep "SessionResponse"`) \
2. Note the line number from the grep result \
3. Use read with offset and limit to read only that range \
   (e.g. `read path offset=250 limit=20`) \
This is critical — reading whole large files wastes context tokens and causes failures.

Never read the same file twice in one turn — if you have already read a file, use \
what you have. Once you can answer the question, stop calling tools \
and respond immediately. Every tool call must bring you closer to the \
answer; if the last tool call did not help, stop and answer with what \
you know.

## Continuity rule

When implementing code or performing multi-step tasks, always include at \
least one tool call in your response. Never stop with a text-only response \
while implementation work remains unfinished. If you have more steps to do, \
use a tool — don't describe what you'll do, do it.

## Working directory

All file paths are relative to the project root unless the user specifies \
otherwise. Do not assume a path — use ls or find to verify it first.

## Code quality

- Match the style and conventions already present in the file you're editing.
- Preserve existing tests; do not delete them unless explicitly asked.
- Prefer small, focused changes over large rewrites.

## Testing discipline

Always test the error/failure path, not just the happy path. If a function can \
fail, write a test that makes it fail and verify the error output. If a tool \
parses external output (cargo, git, rg), inspect real output first to understand \
the format, then write tests with realistic input data.

When building a tool that runs a subprocess, use cargo_check (not bash cargo \
check) to verify compilation — it returns structured errors you can act on.

## Crate dependency rules

graphirm-graph re-exports everything other crates need. Never add petgraph, chrono, \
or rusqlite as direct dependencies in other crates. Use re-exports:

    use graphirm_graph::{
        GraphStore, GraphNode, NodeId, NodeType, Direction,
        AgentData, ContentData, InteractionData, KnowledgeData, TaskData,
        GraphEdge, EdgeId, EdgeType, GraphError,
    };

graphirm-graph uses petgraph 0.7 and chrono 0.4. Adding a different version in \
another crate causes type mismatches that are hard to debug. If you need a type \
that isn't re-exported, add a `pub use` to `crates/graph/src/lib.rs` — don't \
add the upstream crate directly.

## Abstraction boundaries

Use the public API of imported types. Never access private fields or bypass the \
API of a struct from another crate. For GraphStore specifically: use its methods \
(get_node, add_node, traverse, search_knowledge, etc.) — never access internal \
fields like `pool` or `graph` directly. If a method you need does not exist, \
modify the owning crate (graphirm-graph) to add it, then call it from your code.

## Async patterns

When using tokio::task::spawn_blocking with shared state, clone the Arc BEFORE \
each closure. A moved Arc cannot be used again:

    let graph1 = ctx.graph.clone();
    let graph2 = ctx.graph.clone();
    let id = tokio::task::spawn_blocking(move || {
        graph1.add_node(node)
    }).await??;
    tokio::task::spawn_blocking(move || {
        graph2.add_edge(edge)
    }).await??;

Each spawn_blocking gets its own clone. Never reuse an Arc after moving it into \
a closure.
"""
# segment_filter = ["reasoning", "code"]  # restrict context to these segment types
workspaces_root = "/data/workspaces"   # persisted on the Docker volume
enable_compaction = true               # compact old turns when context exceeds threshold
max_continuations = 2                  # auto-inject continuation after text-only mid-task turns
pre_completion_verify = true           # force verification pass (tests + lint) before agent declares done
doom_loop_threshold = 5                # inject advisory after N writes to the same file in one session
read_loop_threshold = 3                # inject advisory after N reads of same file without editing it
# budget_warning_thresholds = [0.7, 0.9]  # warn at these fractions of max_tokens (defaults shown)
enforce_work_loop = true               # inject Plan→Build→Verify→Fix framework into system prompt

# Two-tier model routing — used by [agent.adaptive_routing] strategy = "rules".
# Both models must use the same provider backend (e.g. both via openrouter).
[agent.routing]
cheap = ["openrouter/deepseek/deepseek-v3.2"]
smart = ["openrouter/deepseek/deepseek-v3.2"]
default_tier = "cheap"

[[agent.routing.rules]]
type = "first_turn"
tier = "smart"

[[agent.routing.rules]]
type = "error_recovery"
tier = "smart"

[[agent.routing.rules]]
type = "high_complexity"
min_tokens = 200
tier = "smart"

[[agent.routing.rules]]
type = "tool_only_turn"
tier = "cheap"

[[agent.routing.rules]]
type = "stuck_detection"
turn = 15
tier = "smart"

# Adaptive model routing — strategy-based model selection with A/B testing.
# strategy: "rules" | "prompt" | "experiment"
[agent.adaptive_routing]
strategy = "rules"

[agent.adaptive_routing.objective]
preset = "balanced"   # cost_focused | quality_first | speed | balanced

# For A/B experiment (uncomment to enable):
# [agent.adaptive_routing.experiment]
# strategy_a = "rules"
# strategy_b = "prompt"
# split = 0.5

# For prompt-based classifier (uncomment to enable):
# [agent.adaptive_routing.prompt]
# classifier_model = "openrouter/qwen/qwen3-coder:free"
# timeout_seconds = 3

# Model pricing for cost estimation (optional):
# [[agent.adaptive_routing.candidates]]
# model = "openrouter/qwen/qwen3-coder:free"
# tier = "cheap"
# cost_per_1k_input = 0.0
# cost_per_1k_output = 0.0
#
# [[agent.adaptive_routing.candidates]]
# model = "openrouter/qwen/qwen3-coder-next"
# tier = "smart"
# cost_per_1k_input = 0.002
# cost_per_1k_output = 0.006

[knowledge]
# Knowledge layer thresholds and settings for Phase 9
enabled = true
similarity_threshold = 0.7
entity_extraction_enabled = true
cross_session_memory = true

[agent.extraction]
enabled = true
model = "deepseek-chat"
min_confidence = 0.6
entity_types = ["function", "api", "pattern", "library", "concept", "tool"]

[graph]
database_path = "~/.graphirm/graph.db"
max_connections = 20

[tui]
theme = "dark"
show_graph_panel = false
word_wrap = true

[server]
host = "0.0.0.0"
port = 3000

[agent.segments]
enabled = false
labels = ["observation", "reasoning", "code", "plan", "answer"]
structured_output = true
gliner2_fallback = true
min_confidence = 0.5
