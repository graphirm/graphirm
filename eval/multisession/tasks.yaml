# Frozen before any arm runs. Do not edit this file, the session prompts,
# hidden tests, or decision checks after the commit that introduces them.
#
# Author limitation: these tasks were written inside the Graphirm repository
# by someone who knows Graphirm's tools and context engine. They are ordinary
# Python edits plus a session-1 decision. They do not ask the agent to query
# a graph. That bias is a limitation of the eval, not a property of the tasks.
#
# channel `code`: the session-1 decision is recoverable from the working tree.
# channel `conversation-only`: after session 1 the decision is not in the code.
# Pilot tasks are the two the first paid run uses. The others stay frozen too.

fixture: fixtures/till
pilot:
  - duplicate-409
  - sku-prefix

tasks:
  - id: no-price-cache
    channel: conversation-only
    summary: Rejected module-level price cache. Session 3 adds a bulk lookup and must not cache.
    sessions:
      - prompts/no-price-cache/session1.md
      - prompts/no-price-cache/session2.md
      - prompts/no-price-cache/session3.md
    hidden_tests: hidden/no-price-cache/test_hidden.py
    decision_check: hidden/no-price-cache/decision_check.py

  - id: duplicate-409
    channel: conversation-only
    summary: Duplicate sku creation returns DuplicateSku with code 409. The first create path is session 3.
    sessions:
      - prompts/duplicate-409/session1.md
      - prompts/duplicate-409/session2.md
      - prompts/duplicate-409/session3.md
    hidden_tests: hidden/duplicate-409/test_hidden.py
    decision_check: hidden/duplicate-409/decision_check.py

  - id: integer-tax
    channel: conversation-only
    summary: Tax is integer minor units, half up, and is not implemented until session 3.
    sessions:
      - prompts/integer-tax/session1.md
      - prompts/integer-tax/session2.md
      - prompts/integer-tax/session3.md
    hidden_tests: hidden/integer-tax/test_hidden.py
    decision_check: hidden/integer-tax/decision_check.py

  - id: leave-legacy
    channel: conversation-only
    summary: till/legacy stays byte-for-byte frozen. Session 3 adds half-off beside other offer code.
    sessions:
      - prompts/leave-legacy/session1.md
      - prompts/leave-legacy/session2.md
      - prompts/leave-legacy/session3.md
    hidden_tests: hidden/leave-legacy/test_hidden.py
    decision_check: hidden/leave-legacy/decision_check.py

  - id: sku-prefix
    channel: code
    summary: SKUs gain a T- prefix in session 1. Session 3's importer must keep doing that.
    sessions:
      - prompts/sku-prefix/session1.md
      - prompts/sku-prefix/session2.md
      - prompts/sku-prefix/session3.md
    hidden_tests: hidden/sku-prefix/test_hidden.py
    decision_check: hidden/sku-prefix/decision_check.py

  - id: round-half-up
    channel: code
    summary: Positive division rounds half up in session 1. Session 3's fee uses that helper.
    sessions:
      - prompts/round-half-up/session1.md
      - prompts/round-half-up/session2.md
      - prompts/round-half-up/session3.md
    hidden_tests: hidden/round-half-up/test_hidden.py
    decision_check: hidden/round-half-up/decision_check.py

  - id: no-new-deps
    channel: conversation-only
    summary: SQLAlchemy was rejected. Session 3 persists the drawer with the standard library only.
    sessions:
      - prompts/no-new-deps/session1.md
      - prompts/no-new-deps/session2.md
      - prompts/no-new-deps/session3.md
    hidden_tests: hidden/no-new-deps/test_hidden.py
    decision_check: hidden/no-new-deps/decision_check.py

  - id: export-date
    channel: conversation-only
    summary: Daily export dates are zero-padded MM/DD/YYYY. The exporter is written in session 3.
    sessions:
      - prompts/export-date/session1.md
      - prompts/export-date/session2.md
      - prompts/export-date/session3.md
    hidden_tests: hidden/export-date/test_hidden.py
    decision_check: hidden/export-date/decision_check.py
